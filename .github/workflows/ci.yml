name: Agon acceptance
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:2.22.1-pg17
        env: {POSTGRES_USER: agon, POSTGRES_PASSWORD: agon-local, POSTGRES_DB: agon}
        ports: ["54329:5432"]
        options: --health-cmd "pg_isready -U agon -d agon" --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4-alpine
        ports: ["63799:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: {components: "clippy,rustfmt"}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm}
      - uses: actions/setup-python@v5
        with: {python-version: "3.13"}
      - run: npm ci
      - run: pip install -r training/requirements.txt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo test -p pitwall-store -- --include-ignored --test-threads=1
        env:
          DATABASE_URL: postgres://agon:agon-local@127.0.0.1:54329/agon
          REDIS_URL: redis://127.0.0.1:63799
      - run: cargo test -p pitwall-api --test live -- --include-ignored --test-threads=1
        env:
          DATABASE_URL: postgres://agon:agon-local@127.0.0.1:54329/agon
          REDIS_URL: redis://127.0.0.1:63799
      - run: |
          export ONNXRUNTIME_DYLIB_PATH=$(python -c "import onnxruntime,pathlib; print(next((pathlib.Path(onnxruntime.__file__).parent/'capi').glob('libonnxruntime.so.*')))")
          export AGON_TEST_MODELS=$PWD/models
          cargo test -p pitwall-predict --test model -- --include-ignored
      - run: python -m unittest discover -s training -v
      - run: npm test && npm run build
      - run: git diff --exit-code -- pitwall-web/src/types crates/pitwall-core/bindings
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: {name: browser-failures, path: test-results}
